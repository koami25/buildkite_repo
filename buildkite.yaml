# Storage account delivery pipeline: dev -> uat -> prod
#
#   any branch : validate + plan for every environment (no changes applied)
#   main       : dev applies automatically, uat and prod need manual approval,
#                and each environment only deploys after the previous one succeeded
#
# Shell logic lives in .buildkite/scripts/ because `pipeline upload` replaces
# variables in this file at upload time.

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"
  CHECKPOINT_DISABLE: "1"

steps:
  - label: ":terraform: validate"
    key: "validate"
    command: "bash .buildkite/scripts/tf-validate.sh"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1   # agent lost
          limit: 2

  # ---------------------------------------------------------------- DEV
  - group: ":large_green_circle: dev"
    key: "dev"
    steps:
      - label: ":terraform: plan dev"
        key: "plan-dev"
        depends_on: "validate"
        command: "bash .buildkite/scripts/tf.sh dev plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - label: ":rocket: apply dev"
        key: "apply-dev"
        depends_on: "plan-dev"
        branches: "main"
        command: "bash .buildkite/scripts/tf.sh dev apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/dev"

  # ---------------------------------------------------------------- UAT
  - group: ":large_yellow_circle: uat"
    key: "uat"
    steps:
      - label: ":terraform: plan uat"
        key: "plan-uat"
        depends_on: "validate"
        command: "bash .buildkite/scripts/tf.sh uat plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - block: ":white_check_mark: Approve UAT deploy"
        key: "approve-uat"
        depends_on:
          - "plan-uat"
          - "apply-dev"   # uat only after dev succeeded
        branches: "main"
        prompt: "Review the uat plan annotation above before approving."

      - label: ":rocket: apply uat"
        key: "apply-uat"
        depends_on: "approve-uat"
        branches: "main"
        command: "bash .buildkite/scripts/tf.sh uat apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/uat"

  # ---------------------------------------------------------------- PROD
  - group: ":red_circle: prod"
    key: "prod"
    steps:
      - label: ":terraform: plan prod"
        key: "plan-prod"
        depends_on: "validate"
        command: "bash .buildkite/scripts/tf.sh prod plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - block: ":warning: Approve PRODUCTION deploy"
        key: "approve-prod"
        depends_on:
          - "plan-prod"
          - "apply-uat"   # prod only after uat succeeded
        branches: "main"
        prompt: "Review the prod plan annotation above. This changes production."
        fields:
          - text: "Change ticket"
            key: "prod-change-ticket"
            required: true
            hint: "e.g. CHG0012345"

      - label: ":rocket: apply prod"
        key: "apply-prod"
        depends_on: "approve-prod"
        branches: "main"
        command: "bash .buildkite/scripts/tf.sh prod apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/prod"
