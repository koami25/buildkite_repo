env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

# Shell logic lives in .buildkite/scripts/ because `pipeline upload` replaces
# variables in this file at upload time. Each step runs in a fresh shell, so the
# scripts are sourced at the start of every step.

steps:
  - label: ":terraform: fmt & validate"
    key: "validate"
    commands:
      - source .buildkite/scripts/install-terraform.sh
      - terraform -chdir=terraform fmt -check -recursive
      - terraform -chdir=terraform init -backend=false -input=false
      - terraform -chdir=terraform validate

  - label: ":terraform: plan"
    key: "plan"
    depends_on: "validate"
    commands:
      - source .buildkite/scripts/install-terraform.sh
      - source .buildkite/scripts/azure-login.sh
      - terraform -chdir=terraform init -input=false
      - terraform -chdir=terraform plan -input=false -out=tfplan
    artifact_paths:
      - "terraform/tfplan"

  - block: ":rocket: Apply storage account?"
    key: "approve"
    depends_on: "plan"
    branches: "main"

  - label: ":terraform: apply"
    key: "apply"
    depends_on: "approve"
    branches: "main"
    commands:
      - source .buildkite/scripts/install-terraform.sh
      - source .buildkite/scripts/azure-login.sh
      - terraform -chdir=terraform init -input=false
      - buildkite-agent artifact download "terraform/tfplan" .
      - terraform -chdir=terraform apply -input=false tfplan
      - terraform -chdir=terraform output
