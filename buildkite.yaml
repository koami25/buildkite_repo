# Storage account delivery pipeline, strictly in order: dev -> uat -> prod
#
#   main       : plan dev -> APPROVE -> apply dev
#                -> plan uat -> APPROVE -> apply uat
#                -> plan prod -> APPROVE (+ change ticket) -> apply prod
#   any branch : validate and the three plans only (approvals/applies are skipped)
#
# Nothing is ever applied without a manual approval.
# Approve/apply steps use `if:` rather than `branches:` so that when they are
# skipped on other branches, later steps that depend on them still run.
# Shell logic lives in .buildkite/scripts/ because `pipeline upload` replaces
# variables in this file at upload time.

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"
  CHECKPOINT_DISABLE: "1"

steps:
  - label: ":terraform: validate"
    key: "validate"
    command: "bash .buildkite/scripts/tf-validate.sh"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1   # agent lost
          limit: 2

  # ---------------------------------------------------------------- DEV
  - group: ":large_green_circle: dev"
    key: "dev"
    steps:
      - label: ":terraform: plan dev"
        key: "plan-dev"
        depends_on: "validate"
        command: "bash .buildkite/scripts/tf.sh dev plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - block: ":white_check_mark: Approve DEV deploy"
        key: "approve-dev"
        depends_on: "plan-dev"
        if: build.branch == "main"
        prompt: "Review the dev plan annotation before approving."

      - label: ":rocket: apply dev"
        key: "apply-dev"
        depends_on: "approve-dev"
        if: build.branch == "main"
        command: "bash .buildkite/scripts/tf.sh dev apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/dev"

  # ---------------------------------------------------------------- UAT
  - group: ":large_yellow_circle: uat"
    key: "uat"
    depends_on: "dev"   # uat starts only after the whole dev group succeeded
    steps:
      - label: ":terraform: plan uat"
        key: "plan-uat"
        command: "bash .buildkite/scripts/tf.sh uat plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - block: ":white_check_mark: Approve UAT deploy"
        key: "approve-uat"
        depends_on: "plan-uat"
        if: build.branch == "main"
        prompt: "Review the uat plan annotation before approving."

      - label: ":rocket: apply uat"
        key: "apply-uat"
        depends_on: "approve-uat"
        if: build.branch == "main"
        command: "bash .buildkite/scripts/tf.sh uat apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/uat"

  # ---------------------------------------------------------------- PROD
  - group: ":red_circle: prod"
    key: "prod"
    depends_on: "uat"   # prod starts only after the whole uat group succeeded
    steps:
      - label: ":terraform: plan prod"
        key: "plan-prod"
        command: "bash .buildkite/scripts/tf.sh prod plan"
        timeout_in_minutes: 20
        retry:
          automatic:
            - exit_status: -1
              limit: 2

      - block: ":warning: Approve PRODUCTION deploy"
        key: "approve-prod"
        depends_on: "plan-prod"
        if: build.branch == "main"
        prompt: "Review the prod plan annotation. This changes production."
        fields:
          - text: "Change ticket"
            key: "prod-change-ticket"
            required: true
            hint: "e.g. CHG0012345"

      - label: ":rocket: apply prod"
        key: "apply-prod"
        depends_on: "approve-prod"
        if: build.branch == "main"
        command: "bash .buildkite/scripts/tf.sh prod apply"
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: "bkdemo-storage/prod"
